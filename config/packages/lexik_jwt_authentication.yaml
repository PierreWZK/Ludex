lexik_jwt_authentication:
    secret_key: '%env(resolve:JWT_SECRET_KEY)%'
    public_key: '%env(resolve:JWT_PUBLIC_KEY)%'
    pass_phrase: '%env(JWT_PASSPHRASE)%'
    # Une journée : le site garde la session sans redemander le mot de passe à chaque heure
    token_ttl: 86400
    # Documente POST /api/auth dans Swagger
    api_platform:
        check_path: /api/auth
        username_path: email
        password_path: password
