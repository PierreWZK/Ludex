security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        users:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false
        # POST /api/auth {"email", "password"} : renvoie un jeton JWT ; 5 essais par minute au plus
        auth:
            pattern: ^/api/auth$
            stateless: true
            provider: users
            json_login:
                check_path: /api/auth
                username_path: email
                password_path: password
                success_handler: lexik_jwt_authentication.handler.authentication_success
                failure_handler: lexik_jwt_authentication.handler.authentication_failure
            login_throttling:
                max_attempts: 5
                interval: '1 minute'
        api:
            pattern: ^/api
            stateless: true
            provider: users
            jwt: ~
        main:
            lazy: true
            provider: users

    # Les droits fins sont sur chaque ressource (security: …) ; ici, seulement les grandes portes
    access_control:
        - { path: ^/api/auth$, roles: PUBLIC_ACCESS }
        - { path: ^/api, roles: PUBLIC_ACCESS }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
