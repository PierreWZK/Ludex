framework:
    messenger:
        failure_transport: failed

        transports:
            # Synchronisations Steam : en file d'attente dans MySQL, traitées par le worker lancé dans le conteneur
            async:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                retry_strategy:
                    max_retries: 2
                    delay: 60000
            failed: 'doctrine://default?queue_name=failed'

        routing:
            App\Message\SyncSteamLibrary: async

# Tests : la synchronisation tourne tout de suite, dans la requête
when@test:
    framework:
        messenger:
            transports:
                async: 'sync://'
