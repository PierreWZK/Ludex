framework:
    rate_limiter:
        # Inscriptions : 5 par heure et par adresse IP
        registration:
            policy: sliding_window
            limit: 5
            interval: '1 hour'
        # Synchronisation Steam : une par heure et par joueur (un appel Steam par jeu joué)
        steam_sync:
            policy: fixed_window
            limit: 1
            interval: '1 hour'

