api_platform:
    title: Ludex
    description: |
        L'index de votre ludothèque : catalogue de jeux et de plateformes, collection personnelle, liste d'envies et statistiques.

        Connexion : `POST /api/auth` avec `{"email", "password"}` renvoie un jeton ; cliquez sur « Authorize » et collez `Bearer <jeton>`.
        Compte de démo : `demo@ludex.fr` / `ludex-demo`.

        Steam : `POST /api/steam/link` renvoie l'adresse « Se connecter via Steam » (à ouvrir dans un navigateur), puis `POST /api/steam/sync` importe jeux, temps de jeu et succès.
    version: 1.0.0
    formats:
        jsonld: ['application/ld+json']
        json: ['application/json']
    # Toutes les erreurs au format standard Problem Details (RFC 9457), quel que soit le format demandé
    error_formats:
        jsonproblem: ['application/problem+json']
    docs_formats:
        jsonld: ['application/ld+json']
        jsonopenapi: ['application/vnd.openapi+json']
        html: ['text/html']
    swagger:
        api_keys:
            JWT:
                name: Authorization
                type: header
    defaults:
        stateless: true
        pagination_items_per_page: 20
        pagination_client_items_per_page: true
        pagination_maximum_items_per_page: 100
        cache_headers:
            vary: ['Content-Type', 'Authorization', 'Origin']
